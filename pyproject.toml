[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "st_show_more"
version = "0.1.5"
description = "A Streamlit component that writes text like st.write, truncated to a preview with an inline \"Show more\" button."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["streamlit", "streamlit-component", "show more", "read more", "truncate"]
# Must be valid trove classifiers (https://pypi.org/classifiers/): PyPI rejects
# the upload otherwise. There is no "Framework :: Streamlit" classifier.
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Widget Sets",
]
dependencies = [
    "streamlit>=1.51",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["st_show_more*"]

[tool.setuptools.package-data]
st_show_more = ["frontend/*"]
