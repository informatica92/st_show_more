# Publishes the package to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repo.
# The PyPI trusted publisher must be configured with:
#   owner: informatica92 / repository: <this repo's name>
#   workflow: workflow.yml / environment: pypi

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match version '$VERSION' in pyproject.toml"
            exit 1
          fi

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pytest -q

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/st_show_more
    permissions:
      id-token: write  # required by Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
